const titles=['작은 불씨 하나, 소중한 숲을 위협합니다!','산불은 왜 위험할까요?','산불 주요 위험 행동','꼭 기억할 4가지 실천 수칙','산불 발견 시 행동 요령','산불 예방이 자연을 지킵니다','시민 참여 캠페인','산불 없는 안전한 천안'];
let current=0,auto=null,swapping=false,lastWheel=0;const img=document.getElementById('slide'),topnav=document.getElementById('topnav'),thumbs=document.getElementById('thumbs');
const labels=['표지','위험성','위험 행동','예방 수칙','발견 시','숲 지키기','시민 참여','마무리'];
labels.forEach((label,i)=>{for(const [host,short] of [[topnav,false],[thumbs,true]]){let b=document.createElement('button');b.type='button';b.className=short?'thumb':'navbtn';b.textContent=short?`${i+1}. ${label}`:`${i+1} ${label}`;b.setAttribute('aria-label',`${i+1}번 슬라이드 ${label}`);b.addEventListener('click',()=>show(i));host.appendChild(b)}});
function paint(){img.src=slides[current];img.alt=`${current+1}번 슬라이드: ${titles[current]}`;document.getElementById('title').textContent=titles[current];document.getElementById('count').textContent=`${String(current+1).padStart(2,'0')} / 08`;document.getElementById('page').textContent=`${String(current+1).padStart(2,'0')} / 08`;document.getElementById('progressFill').style.width=`${(current+1)*12.5}%`;[...topnav.children].forEach((b,i)=>{if(i===current){b.setAttribute('aria-current','step');b.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'})}else b.removeAttribute('aria-current')});[...thumbs.children].forEach((b,i)=>b.classList.toggle('active',i===current));history.replaceState(null,'',`#slide-${current+1}`)}
function show(n){let next=Math.max(0,Math.min(slides.length-1,n));if(next===current&&img.src)return;if(swapping)return;swapping=true;img.classList.add('out');setTimeout(()=>{current=next;paint();requestAnimationFrame(()=>{img.classList.remove('out');setTimeout(()=>swapping=false,380)})},230)}
function forward(){show(current+1)}function backward(){show(current-1)}
for(const id of ['next','sideNext'])document.getElementById(id).onclick=forward;for(const id of ['prev','sidePrev'])document.getElementById(id).onclick=backward;
const play=document.getElementById('play');play.onclick=()=>{if(auto){clearInterval(auto);auto=null;play.textContent='▶ 자동 재생'}else{auto=setInterval(()=>show(current===7?0:current+1),5000);play.textContent='Ⅱ 자동 재생 중지'}};
document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();forward()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();backward()}else if(e.key==='Home')show(0);else if(e.key==='End')show(7)});
const frame=document.getElementById('frame');let x=null;frame.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});frame.addEventListener('touchend',e=>{if(x===null)return;let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)d<0?forward():backward();x=null},{passive:true});
frame.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<12)return;e.preventDefault();let now=Date.now();if(now-lastWheel<650)return;lastWheel=now;e.deltaY>0?forward():backward()},{passive:false});
current=Math.max(0,Math.min(7,(parseInt(location.hash.replace('#slide-',''),10)||1)-1));paint();
</script></body></html>
